<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Evento — Casa da Música</title>
  <link rel="stylesheet" href="styles/admin-evento-editar-criar.css" />
</head>
<body>

  <nav class="nav-admin">
    <div class="nav-left">
      <a href="admin.html" class="nav-brand">Casa da Música — Admin</a>
      <a href="admin-eventos.html" class="btn-pill">Eventos</a>
      <a href="admin-relatorios.html" class="btn-pill">Relatórios</a>
      <a href="admin-utilizadores.html" class="btn-pill">Utilizadores</a>
    </div>
    <div class="nav-right">
      <a href="login.html" class="btn-pill btn-pill-light">Sair</a>
    </div>
  </nav>

  <main class="page" style="max-width:800px;">
    <p class="text-sm mb-2"><a href="admin-eventos.html">← Eventos</a></p>
    <h1 class="page-title">Criar Evento</h1>

    <div class="form-card">

      <!-- Informações gerais -->
      <p class="text-bold mb-2">Informações Gerais</p>

      <div class="form-group">
        <label for="titulo">Título do evento</label>
        <input type="text" id="titulo" value="Concerto Sinfónico n.º 12" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="data">Data</label>
          <input type="date" id="data" value="2026-06-15" />
        </div>
        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="time" id="hora" value="21:00" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="local">Local</label>
          <select id="local">
            <option selected>Sala Suggia</option>
            <option>Sala 2</option>
            <option>Grande Auditório</option>
            <option>Terraço</option>
            <option>Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria">
            <option selected>Sinfónico</option>
            <option>Jazz</option>
            <option>Câmara</option>
            <option>Contemporâneo</option>
            <option>World Music</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao">Uma noite inesquecível com a Orquestra Sinfónica do Porto Casa da Música, sob a direção do maestro convidado João Lopes.</textarea>
      </div>

      <div class="form-group">
        <label>Imagem do evento</label>
        <div class="img-box img-box-md" style="margin-bottom:0.5rem;"></div>
        <input type="file" accept="image/*" />
      </div>

      <hr />

      <!-- Tarifários -->
      <p class="text-bold mb-2">Tarifários</p>

      <div class="table-wrap mb-2">
        <table>
          <thead>
            <tr>
              <th>Tipo</th>
              <th>Descrição</th>
              <th>Preço (€)</th>
              <th>Lotação</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Normal</td>
              <td><input type="text" value="Tarifa geral" /></td>
              <td><input type="number" value="25" min="0" step="0.5" /></td>
              <td><input type="number" value="900" min="0" /></td>
            </tr>
            <tr>
              <td>Jovem</td>
              <td><input type="text" value="Até 30 anos" /></td>
              <td><input type="number" value="15" min="0" step="0.5" /></td>
              <td><input type="number" value="200" min="0" /></td>
            </tr>
            <tr>
              <td>Sénior</td>
              <td><input type="text" value="Mais de 65 anos" /></td>
              <td><input type="number" value="18" min="0" step="0.5" /></td>
              <td><input type="number" value="138" min="0" /></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="form-group">
        <label for="lotacao-total">Lotação total</label>
        <input type="number" id="lotacao-total" value="1238" readonly style="background:#e8e8e8;" />
      </div>

      <hr />

      <!-- Estado -->
      <div class="form-group">
        <label for="estado">Estado de publicação</label>
        <select id="estado">
          <option selected>Publicado</option>
          <option>Rascunho</option>
        </select>
      </div>

      <div class="form-actions">
        <button class="btn btn-success">Guardar Alterações</button>
        <a href="admin-eventos.html" class="btn btn-pill-light">Cancelar</a>
      </div>
    </div>
  </main>

</body>
</html>
