<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos — Casa da Música</title>
  <link rel="stylesheet" href="styles/eventos.css" />
</head>
<script>
  fetch('scripts/sessao_status.php')
    .then(r => r.json())
    .then(data => {
      const nav = document.getElementById('nav-right');
      if (data.loggedIn) {
        nav.innerHTML = `
          <span style="font-size:0.9rem;">Olá, ${data.nome}</span>
          <a href="scripts/logout.php" class="btn-pill btn-pill-light">Sair</a>
        `;
      } else {
        nav.innerHTML = `
          <a href="login.html" class="btn-pill">Entrar</a>
        `;
      }
    });
</script>
<script>
  const POR_PAGINA = 12;
  let todosEventos = [];
  let eventosFiltrados = [];

  fetch('scripts/listar_eventos.php')
    .then(r => r.json())
    .then(eventos => {
      todosEventos = eventos;
      eventosFiltrados = eventos;
      renderPagina(1);
    });

  function pesquisar() {
    const nome     = document.getElementById('pesquisa').value.toLowerCase().trim();
    const dataDE   = document.getElementById('data-de').value;
    const dataATE  = document.getElementById('data-ate').value;
    const categoria = document.getElementById('categoria').value.toLowerCase().trim();

    eventosFiltrados = todosEventos.filter(ev => {
      const nomeOk = nome === '' || ev.nome.toLowerCase().includes(nome);
      const catOk  = categoria === '' || ev.categoria.toLowerCase() === categoria;
      const dataEv = ev.data; // formato YYYY-MM-DD
      const deOk   = dataDE  === '' || dataEv >= dataDE;
      const ateOk  = dataATE === '' || dataEv <= dataATE;
      return nomeOk && catOk && deOk && ateOk;
    });

    renderPagina(1);
  }

  function renderPagina(pagina) {
    const inicio = (pagina - 1) * POR_PAGINA;
    const fim = inicio + POR_PAGINA;
    const eventosPagina = eventosFiltrados.slice(inicio, fim);
    const totalPaginas = Math.ceil(eventosFiltrados.length / POR_PAGINA);

    const grid = document.getElementById('cards-grid');

    if (eventosFiltrados.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#555;">Nenhum evento encontrado.</p>';
      document.getElementById('paginacao').innerHTML = '';
      return;
    }

    grid.innerHTML = eventosPagina.map(ev => {
      const data = new Date(ev.data + 'T00:00:00');
      const dataFmt = data.toLocaleDateString('pt-PT', { day: '2-digit', month: 'short', year: 'numeric' });
      const preco = ev.preco_minimo > 0 ? 'A partir de €' + parseFloat(ev.preco_minimo).toFixed(2) : 'Entrada livre';
      return `
        <div class="card">
          <div class="img-box img-box-md"></div>
          <p class="card-title">${ev.nome}</p>
          <p class="card-meta">${dataFmt} · ${ev.hora.substring(0,5)} · ${ev.sala}</p>
          <p class="card-meta">${ev.categoria}</p>
          <div class="card-footer">
            <span class="card-price">${preco}</span>
            <a href="evento.html?id=${ev.id}" class="btn btn-sm">Ver Mais</a>
          </div>
        </div>
      `;
    }).join('');

    const pag = document.getElementById('paginacao');
    let html = '';
    if (pagina > 1) html += `<button class="pg-btn" onclick="renderPagina(${pagina - 1})">‹</button>`;
    for (let i = 1; i <= totalPaginas; i++) {
      html += `<button class="pg-btn ${i === pagina ? 'active' : ''}" onclick="renderPagina(${i})">${i}</button>`;
    }
    if (pagina < totalPaginas) html += `<button class="pg-btn" onclick="renderPagina(${pagina + 1})">›</button>`;
    pag.innerHTML = html;

    document.getElementById('cards-grid').scrollIntoView({ behavior: 'smooth' });
  }
</script>
<body>

  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-brand">Casa da Música</a>
      <a href="eventos.html" class="btn-pill">Eventos</a>
    </div>
    <div class="nav-right" id="nav-right">
      <!-- preenchido pelo JS -->
    </div>
  </nav>

  <main class="page">
    <h1 class="page-title">Eventos</h1>

    <!-- Pesquisa / Filtros -->
    <div class="search-bar">
      <div class="form-group">
        <label for="pesquisa">Pesquisar</label>
        <input type="text" id="pesquisa" placeholder="Nome do evento..." />
      </div>
      <div class="form-group">
        <label for="data-de">Data de</label>
        <input type="date" id="data-de" />
      </div>
      <div class="form-group">
        <label for="data-ate">Data até</label>
        <input type="date" id="data-ate" />
      </div>
      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria">
          <option value="">Todas</option>
          <option value="Música de Câmara">Música de Câmara</option>
          <option value="Jazz">Jazz</option>
          <option value="Música Clássica">Música Clássica</option>
          <option value="World Music">World Music</option>
          <option value="Rock">Rock</option>
          <option value="Ópera">Ópera</option>
          <option value="Música Contemporânea">Música Contemporânea</option>
        </select>
      </div>
      <button class="btn" style="margin-bottom:0" onclick="pesquisar()">Pesquisar</button>
    </div>

    <!-- Grelha de eventos -->
    <div class="cards-grid" id="cards-grid">
      <!-- preenchido pelo JS -->
    </div>

    <!-- Paginação -->
    <div class="pagination" id="paginacao"></div>
  </main>

</body>
</html>
