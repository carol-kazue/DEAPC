<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concerto Sinfónico n.º 12 — Casa da Música</title>
  <link rel="stylesheet" href="styles/evento.css" />
</head>

<body>

  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-brand">Casa da Música</a>
      <a href="eventos.html" class="btn-pill">Eventos</a>
    </div>
    <div class="nav-right" id="nav-right">
      <!-- preenchido pelo JS -->
    </div>
  </nav>

  <main class="page" id="conteudo" style="display:none;">
  <p class="text-sm mb-2"><a href="eventos.html">← Eventos</a></p>
  <div class="img-box img-box-lg mb-2"></div>

  <div class="detail-grid">
    <div>
      <h1 class="page-title" id="ev-nome"></h1>
      <p class="detail-meta" id="ev-data"></p>
      <p class="detail-meta" id="ev-sala"></p>
      <p class="detail-meta" id="ev-categoria"></p>
      <hr />
      <p class="detail-desc" id="ev-descricao"></p>
    </div>

    <div>
      <div class="ticket-box">
        <p class="ticket-box-title">Selecionar Bilhetes</p>
        <div id="ev-precos"></div>
        <a href="carrinho.html" class="btn btn-full mt-3" id="btn-bilhetes">Selecionar Bilhetes</a>
      </div>
      <div class="alert alert-info mt-2">
        <p class="text-sm"><strong>Lugares disponíveis:</strong> <span id="ev-disponiveis"></span></p>
      </div>
    </div>
  </div>
</main>

<main class="page" id="conteudo-erro" style="display:none;">
  <p>Evento não encontrado. <a href="eventos.html">← Voltar aos eventos</a></p>
</main>

<script>
  fetch('scripts/sessao_status.php')
    .then(r => r.json())
    .then(data => {
      const nav = document.getElementById('nav-right');
      if (data.loggedIn) {
        nav.innerHTML = `
          <span style="font-size:0.9rem;">Olá, ${data.nome}</span>
          <a href="scripts/logout.php" class="btn-pill btn-pill-light">Sair</a>
        `;
      } else {
        nav.innerHTML = `
          <a href="login.html" class="btn-pill">Entrar</a>
        `;
      }
    });
</script>

<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('conteudo-erro').style.display = '';
  } else {
    fetch('scripts/get_evento.php?id=' + id)
      .then(r => r.json())
      .then(ev => {
        if (ev.erro) {
          document.getElementById('conteudo-erro').style.display = '';
          return;
        }

        const data = new Date(ev.data + 'T00:00:00');
        const dataFmt = data.toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' });

        document.title = ev.nome + ' — Casa da Música';
        document.getElementById('ev-nome').textContent = ev.nome;
        document.getElementById('ev-data').textContent = '📅 ' + dataFmt + ' · ' + ev.hora.substring(0,5);
        document.getElementById('ev-sala').textContent = '📍 ' + ev.sala + ', Casa da Música, Porto';
        document.getElementById('ev-categoria').textContent = '🏷 ' + ev.categoria;
        document.getElementById('ev-descricao').textContent = ev.descricao ?? '';
        document.getElementById('ev-disponiveis').textContent = ev.disponiveis + ' / ' + ev.capacidade;

        const tiposLabel = { normal: 'Normal', jovem: 'Jovem', senior: 'Sénior' };
        const tiposDesc  = { normal: 'Tarifa geral', jovem: 'Até 30 anos', senior: 'Mais de 65 anos' };
        let precosHtml = '';
        for (const [tipo, preco] of Object.entries(ev.precos)) {
          precosHtml += `
            <div class="ticket-row">
              <div>
                <p class="text-bold">${tiposLabel[tipo] ?? tipo}</p>
                <p class="text-sm">${tiposDesc[tipo] ?? ''}</p>
              </div>
              <span class="ticket-price">${preco > 0 ? '€' + preco.toFixed(2) : 'Grátis'}</span>
            </div>`;
        }
        document.getElementById('ev-precos').innerHTML = precosHtml;

        // Passa o id para o carrinho
        document.getElementById('btn-bilhetes').href = 'carrinho.html?id=' + ev.id;

        document.getElementById('conteudo').style.display = '';
      });
  }
</script>

</body>
</html>
