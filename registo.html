<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — Casa da Música</title>
  <link rel="stylesheet" href="styles/registo.css" />
</head>
<body>

  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-brand">Casa da Música</a>
      <a href="eventos.html" class="btn-pill">Eventos</a>
    </div>
    <div class="nav-right">
      <a href="login.html" class="nav-icon" aria-label="Conta">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.118a7.5 7.5 0 0 1 15 0"/>
        </svg>
      </a>
    </div>
  </nav>

  <main class="page">
    <div class="form-card" style="max-width:480px; margin:3rem auto;">
      <h1 class="page-title text-center">Criar Conta</h1>

      <form action="conta.html">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Nome Apelido" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="email@exemplo.com" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Palavra-passe</label>
            <input type="password" id="password" placeholder="••••••••" />
          </div>
          <div class="form-group">
            <label for="password2">Confirmar palavra-passe</label>
            <input type="password" id="password2" placeholder="••••••••" />
          </div>
        </div>
        <div class="form-group">
          <label for="data-nasc">Data de nascimento</label>
          <input type="date" id="data-nasc" />
        </div>
        <button type="submit" class="btn btn-full mt-2">Registar</button>
      </form>

      <p class="link-row mt-2">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

</body>
</html>
