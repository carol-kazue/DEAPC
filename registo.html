<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — Casa da Música</title>
  <link rel="stylesheet" href="styles/registo.css" />
</head>
<body>

  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-brand">Casa da Música</a>
      <a href="eventos.html" class="btn-pill">Eventos</a>
    </div>
    <div class="nav-right">
      <a href="login.html" class="nav-icon" aria-label="Conta">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.118a7.5 7.5 0 0 1 15 0"/>
        </svg>
      </a>
    </div>
  </nav>

  <main class="page">
    <div class="form-card" style="max-width:480px; margin:3rem auto;">
      <h1 class="page-title text-center">Criar Conta</h1>

      <p id="msg-erro" class="text-sm" style="color:red; text-align:center; display:none;"></p>
      <form action="scripts/registo.php" method="POST">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Nome Apelido" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@exemplo.com" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Palavra-passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" />
          </div>
          <div class="form-group">
            <label for="password2">Confirmar palavra-passe</label>
            <input type="password" id="password2" name="password2" placeholder="••••••••" />
          </div>
        </div>
        <div class="form-group">
          <label for="data-nasc">Data de nascimento</label>
          <input type="date" id="data-nasc" name="data_nasc" />
        </div>
        <button type="submit" class="btn btn-full mt-2">Registar</button>
      </form>

      <p class="link-row mt-2">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const erros = {
      email_existe:         'Este email já está registado.',
      passwords_diferentes: 'As palavras-passe não coincidem.',
      password_curta:       'A palavra-passe deve ter pelo menos 6 caracteres.',
      campos_vazios:        'Preencha todos os campos obrigatórios.'
    };
    if (params.get('erro')) {
      const el = document.getElementById('msg-erro');
      el.textContent = erros[params.get('erro')] || 'Erro desconhecido.';
      el.style.display = 'block';
    }
  </script>
</body>
</html>
