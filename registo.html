<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Registo - Eventos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="navbar">
    <nav class="nav-left">
        <a href="#" class="nav-button">Eventos</a>
    </nav>

    <div class="nav-right">
        <a href="#" class="icon-link" aria-label="Conta">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </a>

        <a href="#" class="icon-link" aria-label="Carrinho">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
        </a>
    </div>
</header>

<main class="content">
    <form class="login-form" action="#" method="post">

        <h3 style="text-align:center;">Novo Registo</h3>

        <!-- Imagem -->
        <div class="form-group">
            <label>Imagem</label>
            <div style="width:120px;height:120px;background:#d9d9d9;border-radius:8px;"></div>
        </div>

        <!-- Nome -->
        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <!-- NIF -->
        <div class="form-group">
            <label for="nif">NIF</label>
            <input type="text" id="nif" name="nif" required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <!-- Senha -->
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="submit-button">Enviar</button>

    </form>
</main>

</body>
</html>
