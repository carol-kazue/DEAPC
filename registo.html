<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — Casa da Música</title>
  <link rel="stylesheet" href="styles/registo.css" />
</head>
<body>

  <nav>
    <div class="nav-left">
      <a href="index.php" class="nav-brand">Casa da Música</a>
      <a href="eventos.php" class="btn-pill">Eventos</a>
    </div>
    <div class="nav-right">
      <a href="login.html" class="nav-icon" aria-label="Conta">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.118a7.5 7.5 0 0 1 15 0"/>
        </svg>
      </a>
    </div>
  </nav>

  <main class="page">
    <div class="form-card" style="max-width:480px; margin:3rem auto;">
      <h1 class="page-title text-center">Criar Conta</h1>

      <p id="msg-erro" class="text-sm" style="color:#c53030; text-align:center; display:none;"></p>

      <form id="form-registo" action="scripts/registo.php" method="POST" novalidate>
        <div class="form-group">
          <label for="nome">Nome completo <span style="color:#c53030;">*</span></label>
          <input type="text" id="nome" name="nome" placeholder="Nome Apelido" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email <span style="color:#c53030;">*</span></label>
          <input type="email" id="email" name="email" placeholder="email@exemplo.com" autocomplete="email" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Palavra-passe <span style="color:#c53030;">*</span></label>
            <input type="password" id="password" name="password" placeholder="Mín. 6 caracteres" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="password2">Confirmar palavra-passe <span style="color:#c53030;">*</span></label>
            <input type="password" id="password2" name="password2" placeholder="Repita a palavra-passe" autocomplete="new-password" />
          </div>
        </div>
        <div class="form-group">
          <label for="data_nasc">Data de nascimento</label>
          <input type="date" id="data_nasc" name="data_nasc" />
        </div>
        <button type="submit" class="btn btn-full mt-2">Registar</button>
      </form>

      <p class="link-row mt-2">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script src="scripts/validacao.js"></script>
  <script>
    const msgErroPHP = {
      campos_vazios:       'Preencha todos os campos obrigatórios.',
      passwords_diferentes:'As palavras-passe não coincidem.',
      password_curta:      'A palavra-passe deve ter pelo menos 6 caracteres.',
      email_existe:        'Este email já está registado.'
    };
    const paramErr = new URLSearchParams(location.search).get('erro');
    if (paramErr && msgErroPHP[paramErr]) {
      const el = document.getElementById('msg-erro');
      el.textContent = msgErroPHP[paramErr];
      el.style.display = 'block';
    }

    const fNome  = document.getElementById('nome');
    const fEmail = document.getElementById('email');
    const fPw    = document.getElementById('password');
    const fPw2   = document.getElementById('password2');
    const fNasc  = document.getElementById('data_nasc');

    // Validação em tempo real
    fEmail.addEventListener('blur', function () {
      if (this.value && !emailValido(this.value)) marcaErro(this, 'Formato de email inválido.');
      else limpaErro(this);
    });
    fPw.addEventListener('input', function () {
      if (this.value && this.value.length < 6) marcaErro(this, 'Mínimo 6 caracteres.');
      else limpaErro(this);
      if (fPw2.value) verificaConfirmacao();
    });
    fPw2.addEventListener('input', verificaConfirmacao);

    function verificaConfirmacao() {
      if (fPw2.value && fPw.value !== fPw2.value)
        marcaErro(fPw2, 'As palavras-passe não coincidem.');
      else limpaErro(fPw2);
    }

    // Validação ao submeter
    document.getElementById('form-registo').addEventListener('submit', function (e) {
      let ok = true;

      if (!fNome.value.trim()) {
        marcaErro(fNome, 'O nome é obrigatório.'); ok = false;
      } else limpaErro(fNome);

      if (!fEmail.value.trim()) {
        marcaErro(fEmail, 'O email é obrigatório.'); ok = false;
      } else if (!emailValido(fEmail.value)) {
        marcaErro(fEmail, 'Formato de email inválido.'); ok = false;
      } else limpaErro(fEmail);

      if (!fPw.value) {
        marcaErro(fPw, 'A palavra-passe é obrigatória.'); ok = false;
      } else if (fPw.value.length < 6) {
        marcaErro(fPw, 'Mínimo 6 caracteres.'); ok = false;
      } else limpaErro(fPw);

      if (!fPw2.value) {
        marcaErro(fPw2, 'Confirme a palavra-passe.'); ok = false;
      } else if (fPw.value !== fPw2.value) {
        marcaErro(fPw2, 'As palavras-passe não coincidem.'); ok = false;
      } else limpaErro(fPw2);

      if (fNasc.value) {
        const nascDate = new Date(fNasc.value);
        const hoje     = new Date();
        const idadeMin = new Date(hoje.getFullYear() - 120, hoje.getMonth(), hoje.getDate());
        if (nascDate > hoje) {
          marcaErro(fNasc, 'A data de nascimento não pode ser no futuro.'); ok = false;
        } else if (nascDate < idadeMin) {
          marcaErro(fNasc, 'Data de nascimento inválida.'); ok = false;
        } else limpaErro(fNasc);
      }

      if (!ok) e.preventDefault();
    });
  </script>
</body>
</html>
