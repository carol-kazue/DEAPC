<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Casa da Música</title>
  <link rel="stylesheet" href="styles/login.css" />
</head>
<body>

  <nav>
    <div class="nav-left">
      <a href="index.php" class="nav-brand">Casa da Música</a>
      <a href="eventos.php" class="btn-pill">Eventos</a>
    </div>
    <div class="nav-right">
      <a href="login.html" class="nav-icon" aria-label="Conta">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.118a7.5 7.5 0 0 1 15 0"/>
        </svg>
      </a>
    </div>
  </nav>

  <main class="page">
    <div class="form-card" style="max-width:440px; margin:3rem auto;">
      <h1 class="page-title text-center">Entrar</h1>

      <p id="msg-erro"    class="text-sm" style="color:#c53030; text-align:center; display:none;"></p>
      <p id="msg-sucesso" class="text-sm" style="color:#276749; text-align:center; display:none;"></p>

      <form id="form-login" action="scripts/login.php" method="POST" novalidate>
        <input type="hidden" id="next" name="next" value="" />
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@exemplo.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Palavra-passe</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-full mt-2">Entrar</button>
      </form>

      <p class="link-row mt-2">Não tem conta? <a href="registo.html">Criar conta</a></p>
    </div>
  </main>

  <script src="scripts/validacao.js"></script>
  <script>
    const params = new URLSearchParams(location.search);

    // Preserva o destino após login
    const next = params.get('next');
    if (next) {
      document.getElementById('next').value = next;
      const msgNext = document.getElementById('msg-sucesso');
      msgNext.textContent = 'Inicie sessão para continuar a compra.';
      msgNext.style.display = 'block';
    }
    const msgErros = {
      credenciais_invalidas: 'Email ou palavra-passe incorretos.',
      campos_vazios: 'Preencha todos os campos.'
    };
    if (params.get('erro')) {
      const el = document.getElementById('msg-erro');
      el.textContent = msgErros[params.get('erro')] || 'Erro desconhecido.';
      el.style.display = 'block';
    }
    if (params.get('sucesso')) {
      const el = document.getElementById('msg-sucesso');
      el.textContent = 'Conta criada com sucesso. Pode entrar agora.';
      el.style.display = 'block';
    }

    const fEmail    = document.getElementById('email');
    const fPassword = document.getElementById('password');

    fEmail.addEventListener('blur', function () {
      if (this.value && !emailValido(this.value)) marcaErro(this, 'Formato de email inválido.');
      else limpaErro(this);
    });

    document.getElementById('form-login').addEventListener('submit', function (e) {
      let ok = true;
      if (!fEmail.value.trim()) {
        marcaErro(fEmail, 'O email é obrigatório.'); ok = false;
      } else if (!emailValido(fEmail.value)) {
        marcaErro(fEmail, 'Formato de email inválido.'); ok = false;
      } else limpaErro(fEmail);

      if (!fPassword.value) {
        marcaErro(fPassword, 'A palavra-passe é obrigatória.'); ok = false;
      } else limpaErro(fPassword);

      if (!ok) e.preventDefault();
    });
  </script>
</body>
</html>
