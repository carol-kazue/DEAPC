<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEAPC</title>
  <link rel="stylesheet" href="styles/index.css" />
</head>
<script>
  fetch('scripts/sessao_status.php')
    .then(r => r.json())
    .then(data => {
      const nav = document.getElementById('nav-right');
      if (data.loggedIn) {
        nav.innerHTML = `
          <span style="font-size:0.9rem;">Olá, ${data.nome}</span>
          <a href="scripts/logout.php" class="btn-pill btn-pill-light">Sair</a>
        `;
      } else {
        nav.innerHTML = `
          <a href="login.html" class="btn-pill">Entrar</a>
        `;
      }
    });
</script>
<body>

  <!-- white space above nav -->
  <div class="hero-space"></div>

  <!-- NAV BAR -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="nav-brand">Casa da Música</a>
      <a href="eventos.html" class="btn-pill">Eventos</a>
    </div>
    <div class="nav-right" id="nav-right">
      <!-- preenchido pelo JS -->
    </div>
  </nav>

  <!-- space below nav -->
  <div class="below-nav"></div>

  <!-- MAIN PANELS -->
  <main class="content">

    <!-- LEFT: Consertos em Destaque -->
    <section class="panel-left">
      <p class="panel-title">Consertos em Destaque</p>
      <div class="placeholder-img"></div>
      <div class="panel-left-actions">
        <a href="#" class="btn-pill">Ver Mais</a>
        <a href="#" class="btn-pill">Ver Mais</a>
      </div>
    </section>

    <!-- RIGHT: Quem somos -->
    <section class="panel-right">
      <p class="panel-title">Quem somos</p>
      <div class="placeholder-img"></div>
    </section>

  </main>

</body>
</html>
