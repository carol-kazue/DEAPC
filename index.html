<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEAPC</title>
  <link rel="stylesheet" href="styles/index.css" />
</head>
<body>

  <!-- white space above nav -->
  <div class="hero-space"></div>

  <!-- NAV BAR -->
  <nav>
    <div class="nav-left">
      <a href="#" class="btn-pill">Eventos</a>
    </div>
    <div class="nav-right">
      <!-- person icon -->
      <button class="nav-icon" aria-label="Conta">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z
                   M4.5 20.118a7.5 7.5 0 0 1 15 0"/>
        </svg>
      </button>
      <!-- cart icon -->
      <button class="nav-icon" aria-label="Carrinho">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437
                   M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3

                   M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75
                   0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1
                   1.5 0Z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- space below nav -->
  <div class="below-nav"></div>

  <!-- MAIN PANELS -->
  <main class="content">

    <!-- LEFT: Consertos em Destaque -->
    <section class="panel-left">
      <p class="panel-title">Consertos em Destaque</p>
      <div class="placeholder-img"></div>
      <div class="panel-left-actions">
        <a href="#" class="btn-pill">Ver Mais</a>
        <a href="#" class="btn-pill">Ver Mais</a>
      </div>
    </section>

    <!-- RIGHT: Quem somos -->
    <section class="panel-right">
      <p class="panel-title">Quem somos</p>
      <div class="placeholder-img"></div>
    </section>

  </main>

</body>
</html>
